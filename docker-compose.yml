services:
  postgres:
    image: postgres:16-alpine
    container_name: aivoa-postgres
    environment:
      POSTGRES_DB: aivoa
      POSTGRES_USER: aivoa
      POSTGRES_PASSWORD: aivoa
    ports:
      - "5432:5432"
    volumes:
      - aivoa_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aivoa -d aivoa"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  aivoa_postgres_data:
